# Trendscope - one command:   ./scripts/init-env.sh && docker compose up -d --build
# Offline demo (simulated market, no Binance needed):
#   BINANCE_BASE_URL=http://simulator:9100 docker compose --profile demo up -d --build

x-backend: &backend
  build: ./backend
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://trendscope_app:${APP_DB_PASSWORD}@db:5432/trendscope
    BINANCE_BASE_URL: ${BINANCE_BASE_URL:-https://data-api.binance.vision}
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: trendscope
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      OWNER_DB_PASSWORD: ${OWNER_DB_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      READONLY_DB_PASSWORD: ${READONLY_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/10-init-db.sh:ro
      - ./backend/sql/00_roles.sql:/docker-entrypoint-initdb.d/sql/00_roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trendscope"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published to the host: only the app containers can reach the database.

  migrate:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://trendscope_app:${APP_DB_PASSWORD}@db:5432/trendscope
      MIGRATION_DATABASE_URL: postgresql+psycopg://trendscope_owner:${OWNER_DB_PASSWORD}@db:5432/trendscope
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend

  worker:
    <<: *backend
    command: ["python", "-m", "engine.worker"]
    healthcheck:
      disable: true

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      - api

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${READONLY_DB_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  simulator:
    profiles: ["demo"]
    build: ./backend
    command: ["python", "-m", "engine.simulator", "--port", "9100"]
    restart: unless-stopped
    healthcheck:
      disable: true

volumes:
  pgdata:
